name: Probe Gemini models

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Space-separated model names (empty = default list)"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked
      - run: uv run python probe_models.py $IN_MODELS
        env:
          IN_MODELS: ${{ inputs.models }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
